<!DOCTYPE html>
<html lang="en">
<head>

  <link
  rel="stylesheet"
  href="style.css"
>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Metronome (BETA)</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 0;
      position: relative;
      overflow-x: hidden;

      font-family:
        Rubik,
        Arial,
        sans-serif;

      color: white;
    }

    /* ==================================================
       MAIN BOX
       ================================================== */

    .box {
      width: 980px;
      max-width: 96%;
      padding: 24px;

      border-radius: 25px;

      background:
        rgba(255, 255, 255, 0.12);

      border:
        1px solid rgba(255, 255, 255, 0.25);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      text-align: center;

      box-shadow:
        0 0 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 38px;
    }

    .subtitle {
      margin-bottom: 20px;
      opacity: 0.9;
      font-size: 17px;
      font-weight: bold;
    }

    /* ==================================================
       TOTAL BARS — BEAT LIGHTS — TOTAL BEATS
       ================================================== */

    .bar-beat-display {
      width: 100%;

      display: grid;

      grid-template-columns:
        145px
        minmax(0, 1fr)
        145px;

      align-items: center;
      gap: 20px;

      margin:
        16px 0 18px;
    }

    /* ==================================================
       SIDE COUNTERS
       ================================================== */

    .side-counter {
      min-height: 105px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;
    }

    .side-counter-title {
      margin-bottom: 7px;

      color: white;

      font-size: 17px;
      font-weight: bold;
    }

    .side-counter-value {
      color: white;

      font-size: 40px;
      font-weight: bold;

      line-height: 1;
    }

    /* ==================================================
       BEAT LIGHTS
       ================================================== */

    .center-beats {
      min-width: 0;
    }

    .beat-lights {
      min-height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-evenly;

      gap: 12px;

      padding: 5px;
      margin: 0;
    }

    .beat-light {
      width: 48px;
      height: 48px;

      flex: 0 0 auto;

      display: grid;
      place-items: center;

      padding: 0;

      border:
        2px solid rgba(255, 255, 255, 0.80);

      border-radius: 50%;

      cursor: pointer;

      font-family: inherit;
      font-size: 17px;
      font-weight: bold;

      transition:
        transform 0.10s ease,
        background 0.15s ease,
        box-shadow 0.15s ease,
        opacity 0.15s ease;
    }

    /* ==================================================
       NORMAL BEAT = GREEN
       ================================================== */

    .beat-light.normal {
      background:
        radial-gradient(
          circle at 35% 30%,
          #c5ffca,
          #39d353 38%,
          #16852b 72%
        );

      color: #073b10;

      box-shadow:
        inset 0 0 8px rgba(255, 255, 255, 0.65),
        0 0 10px rgba(57, 211, 83, 0.55);
    }

    /* ==================================================
       ACCENTED BEAT = RED
       ================================================== */

    .beat-light.accent {
      background:
        radial-gradient(
          circle at 35% 30%,
          #ffaaaa,
          #ff3030 42%,
          #a80000 75%
        );

      color: white;

      box-shadow:
        inset 0 0 8px rgba(255, 255, 255, 0.60),
        0 0 11px rgba(255, 48, 48, 0.65);
    }

    /* ==================================================
       OFF BEAT
       ================================================== */

    .beat-light.off {
      background:
        radial-gradient(
          circle at 35% 30%,
          #777777,
          #454545 45%,
          #222222 80%
        );

      color:
        rgba(255, 255, 255, 0.55);

      opacity: 0.65;

      box-shadow:
        inset 0 0 5px rgba(255, 255, 255, 0.15);
    }

    /* ==================================================
       CURRENT PLAYING BEAT
       ================================================== */

    .beat-light.playing {
      transform:
        scale(1.25);

      box-shadow:
        0 0 0 5px rgba(255, 255, 255, 0.25),
        0 0 25px rgba(255, 255, 255, 0.90);
    }

    .beat-light:hover {
      transform:
        scale(1.08);
    }

    .beat-light.playing:hover {
      transform:
        scale(1.25);
    }

    /* ==================================================
       BEAT LEGEND
       ================================================== */

    .beat-help {
      margin-top: 3px;

      color:
        rgba(255, 255, 255, 0.88);

      font-size: 13px;
      font-weight: bold;
    }

    /* ==================================================
       CONTINUOUS LEFT ↔ RIGHT BEAT ANIMATION
       ================================================== */

    .beat-motion-area {
      position: relative;

      height: 64px;

      margin:
        8px 10px 22px;
    }

    .beat-track {
      position: absolute;

      left: 25px;
      right: 25px;

      top: 50%;

      height: 3px;

      transform:
        translateY(-50%);

      background:
        rgba(40, 40, 40, 0.75);

      border-radius: 3px;
    }

    .beat-runner {
      position: absolute;

      top: 50%;
      left: 25px;

      width: 34px;
      height: 34px;

      border-radius: 50%;

      transform:
        translate(-50%, -50%);

      background:
        radial-gradient(
          circle at 35% 30%,
          #ff9b9b,
          #ed2727 38%,
          #bd0c0c 65%,
          #740000 100%
        );

      border:
        2px solid rgba(100, 0, 0, 0.75);

      box-shadow:
        inset 0 0 7px rgba(255, 255, 255, 0.45),
        0 2px 8px rgba(0, 0, 0, 0.45);

      transition: none;

      will-change: left;
    }

    /* ==================================================
       BPM CONTROL
       ================================================== */

    .tempo-main {
      max-width: 680px;

      margin:
        8px auto 18px;

      display: grid;

      grid-template-columns:
        110px
        minmax(0, 1fr)
        110px;

      align-items: center;

      gap: 20px;
    }

    .tempo-side {
      display: grid;
      gap: 12px;
    }

    .step-button {
      width: 72px;
      height: 52px;

      margin: auto;

      border:
        2px solid rgba(255, 255, 255, 0.30);

      border-radius: 8px;

      background:
        rgba(255, 255, 255, 0.08);

      color: white;

      cursor: pointer;

      font-family: inherit;
      font-size: 20px;
      font-weight: bold;
    }

    .step-button:hover {
      background:
        rgba(255, 255, 255, 0.18);
    }

    .tempo-center {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 10px;
    }

    .bpm-input {
      width: 150px;

      padding:
        10px 12px;

      border: none;
      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.94);

      color: #333;

      text-align: center;

      font-family: inherit;
      font-size: 48px;

      outline: none;
    }

    .bpm-text {
      font-size: 20px;
      font-weight: bold;
    }

    /* ==================================================
       TEMPO SLIDER
       ================================================== */

    .tempo-slider-section {
      margin:
        10px 15px 18px;
    }

    .tempo-marking {
      margin-bottom: 8px;

      text-align: right;

      font-size: 17px;
      font-weight: bold;
    }

    .tempo-slider {
      width: 100%;
      cursor: pointer;
    }

    /* ==================================================
       VOLUME
       ================================================== */

    .volume-control {
      margin:
        18px 0;

      padding:
        13px 18px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 14px;

      border-radius: 14px;

      background:
        rgba(255, 255, 255, 0.16);

      font-size: 17px;
      font-weight: bold;
    }

    .volume-control label {
      white-space: nowrap;
    }

    .volume-control input[type="range"] {
      width:
        min(420px, 55%);
    }

    .volume-display {
      min-width: 60px;

      padding:
        7px 9px;

      border-radius: 8px;

      background: white;

      color: #444;

      font-weight: bold;
    }

    /* ==================================================
       PERFORMANCE ROW
       ================================================== */

    .performance-row {
      display: grid;

      grid-template-columns:
        1fr
        auto
        1fr;

      align-items: center;

      gap: 25px;

      margin:
        22px 15px 12px;
    }

    /* ==================================================
       BEATS PER BAR / CLICKS PER BEAT
       ================================================== */

    .quick-setting {
      min-width: 130px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 4px;
    }

    .quick-setting label {
      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    .quick-setting-select {
      width: 95px;
      min-height: 48px;

      border: none;
      border-radius: 8px;

      background:
        transparent;

      color: white;

      text-align: center;
      text-align-last: center;

      font-family: inherit;

      font-size: 32px;
      font-weight: bold;

      cursor: pointer;

      outline: none;
    }

    .quick-setting-select:hover {
      background:
        rgba(255, 255, 255, 0.10);
    }

    .quick-setting-select option {
      background: #333333;

      color: white;

      font-size: 18px;
    }

    /* ==================================================
       START / STOP
       ================================================== */

    .start-button {
      width: 84px;
      height: 84px;

      border: none;
      border-radius: 50%;

      cursor: pointer;

      background:
        #28a745;

      color: white;

      font-family: inherit;
      font-size: 30px;

      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.25);
    }

    .start-button:hover {
      background:
        #1f7f35;
    }

    .start-button.stop-button {
      background:
        #ff3030;
    }

    .start-button.stop-button:hover {
      background:
        #cc0000;
    }

    /* ==================================================
       TAP TEMPO
       ================================================== */

    .tap-area {
      margin:
        12px 0 18px;
    }

    .tap-button {
      min-width: 190px;

      padding:
        12px 24px;

      border: none;
      border-radius: 10px;

      background: white;

      color: #555;

      cursor: pointer;

      font-family: inherit;

      font-size: 18px;
      font-weight: bold;
    }

    .tap-button:hover {
      background:
        #dddddd;
    }

    /* ==================================================
       BACK HOME
       ================================================== */

    .back-home {
      display: inline-block;

      margin-top: 18px;

      color: white;

      text-decoration: none;

      font-weight: bold;
    }

    /* ==================================================
       MOBILE
       ================================================== */

    @media (max-width: 700px) {

      .box {
        padding: 14px;
      }

      h1 {
        font-size: 28px;
      }

      .subtitle {
        font-size: 14px;
      }

      .bar-beat-display {
        grid-template-columns:
          70px
          minmax(0, 1fr)
          70px;

        gap: 6px;
      }

      .side-counter-title {
        font-size: 11px;
      }

      .side-counter-value {
        font-size: 27px;
      }

      .beat-lights {
        gap: 5px;
        flex-wrap: wrap;
      }

      .beat-light {
        width: 37px;
        height: 37px;

        font-size: 13px;
      }

      .beat-help {
        font-size: 9px;
      }

      .tempo-main {
        grid-template-columns:
          72px
          minmax(0, 1fr)
          72px;

        gap: 5px;
      }

      .step-button {
        width: 58px;
        height: 48px;

        font-size: 15px;
      }

      .bpm-input {
        width: 110px;

        font-size: 37px;
      }

      .bpm-text {
        display: none;
      }

      .volume-control {
        flex-wrap: wrap;
      }

      .volume-control input[type="range"] {
        width: 60%;
      }

      .performance-row {
        gap: 6px;

        margin-left: 0;
        margin-right: 0;
      }

      .quick-setting {
        min-width: 0;
      }

      .quick-setting label {
        font-size: 11px;
      }

      .quick-setting-select {
        width: 65px;

        font-size: 25px;
      }

      .start-button {
        width: 68px;
        height: 68px;

        font-size: 24px;
      }
    }

  </style>
</head>


<body>

  <div class="box">

    <h1>
      Metronome (BETA)
    </h1>

    <div class="subtitle">
      Tap each beat light to choose Normal, Accented, or Off.
    </div>


    <!-- ==================================================
         TOTAL BARS — BEAT LIGHTS — TOTAL BEATS
         ================================================== -->

    <div class="bar-beat-display">


      <!-- TOTAL BARS -->

      <div
        id="barCounterBox"
        class="side-counter"
      >

        <div class="side-counter-title">
          Total Bars
        </div>

        <div
          id="barCounter"
          class="side-counter-value"
        >
          0
        </div>

      </div>


      <!-- BEAT LIGHTS
           ALWAYS VISIBLE -->

      <div class="center-beats">

        <div
          id="beatLights"
          class="beat-lights"
        ></div>

        <div class="beat-help">
          🟢 Normal
          &nbsp; • &nbsp;
          🔴 Accented
          &nbsp; • &nbsp;
          ⚫ Off
        </div>

      </div>


      <!-- TOTAL BEATS -->

      <div
        id="beatCounterBox"
        class="side-counter"
      >

        <div class="side-counter-title">
          Total Beats
        </div>

        <div
          id="beatCounter"
          class="side-counter-value"
        >
          0
        </div>

      </div>

    </div>


    <!-- ==================================================
         CONTINUOUS BEAT ANIMATION
         ================================================== -->

    <div
      id="beatMotionArea"
      class="beat-motion-area"
    >

      <div class="beat-track"></div>

      <div
        id="beatRunner"
        class="beat-runner"
      ></div>

    </div>


    <!-- ==================================================
         BPM CONTROLS
         ================================================== -->

    <div class="tempo-main">


      <!-- MINUS -->

      <div class="tempo-side">

        <button
          class="step-button"
          type="button"
          onclick="changeBPM(-1)"
        >
          −1
        </button>

        <button
          class="step-button"
          type="button"
          onclick="changeBPM(-5)"
        >
          −5
        </button>

      </div>


      <!-- BPM -->

      <div class="tempo-center">

        <input
          id="bpmInput"
          class="bpm-input"
          type="number"
          min="5"
          max="500"
          value="100"
          onchange="setBPM(this.value)"
        >

        <span class="bpm-text">
          BPM
        </span>

      </div>


      <!-- PLUS -->

      <div class="tempo-side">

        <button
          class="step-button"
          type="button"
          onclick="changeBPM(1)"
        >
          +1
        </button>

        <button
          class="step-button"
          type="button"
          onclick="changeBPM(5)"
        >
          +5
        </button>

      </div>

    </div>


    <!-- ==================================================
         BPM SLIDER
         ================================================== -->

    <div class="tempo-slider-section">

      <div
        id="tempoMarking"
        class="tempo-marking"
      >
        Andante
      </div>

      <input
        id="bpmSlider"
        class="tempo-slider"
        type="range"
        min="5"
        max="500"
        step="1"
        value="100"
        oninput="setBPM(this.value)"
      >

    </div>


    <!-- ==================================================
         VOLUME
         ================================================== -->

    <div class="volume-control">

      <label for="volumeSlider">
        🔊 Metronome Volume:
      </label>

      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="100"
        step="1"
        value="70"
        oninput="updateVolume(this.value)"
      >

      <span
        id="volumeDisplay"
        class="volume-display"
      >
        70%
      </span>

    </div>


    <!-- ==================================================
         BEATS PER BAR — START — CLICKS PER BEAT
         ================================================== -->

    <div class="performance-row">


      <!-- BEATS PER BAR -->

      <div class="quick-setting">

        <label for="beatsPerBar">
          Beats per bar
        </label>

        <select
          id="beatsPerBar"
          class="quick-setting-select"
          onchange="changeBeatsPerBar()"
        >

          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>

          <option
            value="4"
            selected
          >
            4
          </option>

          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>

        </select>

      </div>


      <!-- START / STOP -->

      <button
        id="startButton"
        class="start-button"
        type="button"
        onclick="toggleMetronome()"
        title="Start Metronome"
      >
        ▶
      </button>


      <!-- CLICKS PER BEAT -->

      <div class="quick-setting">

        <label for="clicksPerBeat">
          Clicks per beat
        </label>

        <select
          id="clicksPerBeat"
          class="quick-setting-select"
          onchange="changeClicksPerBeat()"
        >

          <option
            value="1"
            selected
          >
            1
          </option>

          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>

        </select>

      </div>

    </div>


    <!-- ==================================================
         TAP TEMPO
         ================================================== -->

    <div class="tap-area">

      <button
        class="tap-button"
        type="button"
        onclick="tapTempo()"
      >
        TAP TEMPO
      </button>

    </div>


    <!-- ==================================================
         HOME
         ================================================== -->

    <a
      href="index.html"
      class="back-home"
    >
      ← Back to Home
    </a>

  </div>


<script>

  /* ==================================================
     BASIC SETTINGS
     ================================================== */

  let bpm =
    100;

  let isRunning =
    false;

  let timer =
    null;

  let currentBeat =
    0;

  let totalBeats =
    0;

  let totalBars =
    0;

  let clicksPerBeat =
    1;

  let metronomeVolume =
    0.70;

  let audioContext =
    null;

  let tapTimes =
    [];

  let beatModes =
    [];

  let beatAnimationFrame =
    null;


  /* ==================================================
     INTERNAL FEATURE SWITCHES
     ================================================== */


  /*
    ==================================================
    BAR / BEAT COUNTERS

    true [for Spotify Premium all]:
      Show TOTAL BARS & TOTAL BEATS

    false [for Spotify Free]:
      Hide TOTAL BARS & TOTAL BEATS

    IMPORTANT:
      BEAT LIGHTS ALWAYS REMAIN VISIBLE.

    The metronome continues operating
    internally while counters are hidden.
    ==================================================
  */

  const BAR_BEAT_DISPLAY_VISIBLE =
    true;


  /*
    ==================================================
    BEAT ANIMATION

    true:
      Show continuous moving red ball.

    false:
      Hide the moving beat animation.

    Beat lights are not affected.
    ==================================================
  */

  const BEAT_ANIMATION_ENABLED =
    true;


  /* ==================================================
     AUDIO CONTEXT
     ================================================== */

  function getAudioContext() {

    if (
      !audioContext
    ) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    return audioContext;
  }


  /* ==================================================
     VOLUME
     ================================================== */

  function updateVolume(
    value
  ) {

    let volume =
      Number(
        value
      );


    if (
      Number.isNaN(
        volume
      )
    ) {

      volume =
        70;

    }


    volume =
      Math.max(
        0,
        Math.min(
          volume,
          100
        )
      );


    metronomeVolume =
      volume /
      100;


    document.getElementById(
      "volumeSlider"
    ).value =
      volume;


    document.getElementById(
      "volumeDisplay"
    ).textContent =
      Math.round(
        volume
      ) +
      "%";
  }


  /* ==================================================
     SINGLE CLICK
     ================================================== */

  function playSingleClick(
    mode,
    delay,
    isSubdivision
  ) {

    if (
      mode ===
      "off"
    ) {

      return;

    }


    const context =
      getAudioContext();


    const oscillator =
      context.createOscillator();


    const gain =
      context.createGain();


    oscillator.type =
      "square";


    const accentThisClick =

      mode === "accent" &&
      !isSubdivision;


    const startTime =
      context.currentTime +
      delay;


    oscillator.frequency.setValueAtTime(

      accentThisClick
        ? 1000
        : 500,

      startTime

    );


    let clickVolume;


    if (
      accentThisClick
    ) {

      clickVolume =
        metronomeVolume *
        0.90;

    } else if (
      isSubdivision
    ) {

      clickVolume =
        metronomeVolume *
        0.48;

    } else {

      clickVolume =
        metronomeVolume *
        0.65;

    }


    clickVolume =
      Math.min(
        clickVolume,
        1
      );


    const beatDuration =
      60 /
      bpm;


    const subdivisionDuration =
      beatDuration /
      clicksPerBeat;


    const clickDuration =
      Math.max(
        0.003,
        Math.min(
          0.040,
          subdivisionDuration *
          0.45
        )
      );


    if (
      clickVolume <=
      0
    ) {

      gain.gain.setValueAtTime(
        0,
        startTime
      );

    } else {

      gain.gain.setValueAtTime(
        clickVolume,
        startTime
      );


      gain.gain.exponentialRampToValueAtTime(

        0.001,

        startTime +
        clickDuration

      );

    }


    oscillator.connect(
      gain
    );


    gain.connect(
      context.destination
    );


    oscillator.start(
      startTime
    );


    oscillator.stop(

      startTime +
      clickDuration +
      0.005

    );
  }


  /* ==================================================
     PLAY CURRENT BEAT
     ================================================== */

  function playClick(
    mode
  ) {

    if (
      mode ===
      "off"
    ) {

      return;

    }


    const beatDuration =
      60 /
      bpm;


    const clickSpacing =
      beatDuration /
      clicksPerBeat;


    for (
      let i = 0;
      i < clicksPerBeat;
      i++
    ) {

      playSingleClick(

        mode,

        i *
        clickSpacing,

        i > 0

      );

    }
  }


  /* ==================================================
     CREATE BEAT LIGHTS
     ================================================== */

  function createBeatLights() {

    const container =
      document.getElementById(
        "beatLights"
      );


    const beats =
      Number(
        document.getElementById(
          "beatsPerBar"
        ).value
      );


    const oldModes =
      [...beatModes];


    beatModes =
      [];


    for (
      let i = 0;
      i < beats;
      i++
    ) {

      if (
        oldModes[i]
      ) {

        beatModes[i] =
          oldModes[i];

      } else if (
        i === 0
      ) {

        beatModes[i] =
          "accent";

      } else {

        beatModes[i] =
          "normal";

      }
    }


    container.innerHTML =
      "";


    for (
      let i = 0;
      i < beats;
      i++
    ) {

      const light =
        document.createElement(
          "button"
        );


      light.type =
        "button";


      light.className =
        "beat-light";


      light.id =
        "beatLight" +
        (i + 1);


      light.textContent =
        i + 1;


      light.addEventListener(
        "click",
        function() {

          cycleBeatMode(
            i
          );

        }
      );


      container.appendChild(
        light
      );
    }


    updateBeatLightStyles();
  }


  /* ==================================================
     BEAT MODE DESCRIPTION
     ================================================== */

  function getBeatModeTitle(
    mode
  ) {

    if (
      mode ===
      "accent"
    ) {

      return (
        "Accented — click to turn Off"
      );

    }


    if (
      mode ===
      "off"
    ) {

      return (
        "Off — click to make Normal"
      );

    }


    return (
      "Normal — click to make Accented"
    );
  }


  /* ==================================================
     BEAT MODE CYCLE

     NORMAL
       ↓
     ACCENTED
       ↓
     OFF
       ↓
     NORMAL
     ================================================== */

  function cycleBeatMode(
    index
  ) {

    const mode =
      beatModes[index];


    if (
      mode ===
      "normal"
    ) {

      beatModes[index] =
        "accent";

    } else if (
      mode ===
      "accent"
    ) {

      beatModes[index] =
        "off";

    } else {

      beatModes[index] =
        "normal";

    }


    updateBeatLightStyles();
  }


  /* ==================================================
     UPDATE BEAT COLORS
     ================================================== */

  function updateBeatLightStyles() {

    beatModes.forEach(

      function(
        mode,
        index
      ) {

        const light =
          document.getElementById(
            "beatLight" +
            (index + 1)
          );


        if (
          !light
        ) {

          return;

        }


        light.classList.remove(
          "normal",
          "accent",
          "off"
        );


        light.classList.add(
          mode
        );


        light.title =
          getBeatModeTitle(
            mode
          );


        light.setAttribute(
          "aria-label",

          "Beat " +
          (index + 1) +
          ": " +
          mode

        );

      }

    );
  }


  /* ==================================================
     CURRENT BEAT VISUAL
     ================================================== */

  function flashBeat(
    beat
  ) {

    document
      .querySelectorAll(
        ".beat-light"
      )
      .forEach(

        function(
          light
        ) {

          light.classList.remove(
            "playing"
          );

        }

      );


    const currentLight =
      document.getElementById(
        "beatLight" +
        beat
      );


    if (
      !currentLight
    ) {

      return;

    }


    currentLight.classList.add(
      "playing"
    );
  }


  /* ==================================================
     CONTINUOUS BEAT ANIMATION

     One side-to-side journey
     equals one MAIN beat.

     Beat 1:
       LEFT → RIGHT

     Beat 2:
       RIGHT → LEFT

     Beat 3:
       LEFT → RIGHT
     ================================================== */

  function startBeatMotionLeg() {

    if (
      !BEAT_ANIMATION_ENABLED ||
      !isRunning
    ) {

      return;

    }


    const area =
      document.getElementById(
        "beatMotionArea"
      );


    const runner =
      document.getElementById(
        "beatRunner"
      );


    if (
      !area ||
      !runner
    ) {

      return;

    }


    if (
      beatAnimationFrame
    ) {

      cancelAnimationFrame(
        beatAnimationFrame
      );


      beatAnimationFrame =
        null;

    }


    const minimum =
      25;


    const maximum =
      Math.max(

        minimum,

        area.clientWidth -
        25

      );


    /*
      Odd beat:
      LEFT → RIGHT

      Even beat:
      RIGHT → LEFT
    */

    const moveRight =
      totalBeats %
      2 ===
      1;


    const startX =
      moveRight
        ? minimum
        : maximum;


    const endX =
      moveRight
        ? maximum
        : minimum;


    const duration =
      60000 /
      bpm;


    const startTime =
      performance.now();


    runner.style.left =
      startX +
      "px";


    function animate(
      now
    ) {

      if (
        !isRunning
      ) {

        return;

      }


      const elapsed =
        now -
        startTime;


      const progress =
        Math.min(
          elapsed /
          duration,
          1
        );


      const position =
        startX +
        (
          endX -
          startX
        ) *
        progress;


      runner.style.left =
        position +
        "px";


      if (
        progress <
        1 &&
        isRunning
      ) {

        beatAnimationFrame =
          requestAnimationFrame(
            animate
          );

      } else {

        beatAnimationFrame =
          null;


        runner.style.left =
          endX +
          "px";

      }
    }


    beatAnimationFrame =
      requestAnimationFrame(
        animate
      );
  }


  /* ==================================================
     RESET BEAT ANIMATION
     ================================================== */

  function resetBeatAnimation() {

    if (
      beatAnimationFrame
    ) {

      cancelAnimationFrame(
        beatAnimationFrame
      );


      beatAnimationFrame =
        null;

    }


    const runner =
      document.getElementById(
        "beatRunner"
      );


    if (
      runner
    ) {

      runner.style.left =
        "25px";

    }
  }


  /* ==================================================
     METRONOME TICK
     ================================================== */

  function tick() {

    const beatsPerBar =
      Number(
        document.getElementById(
          "beatsPerBar"
        ).value
      );


    /*
      FIRST BEAT
    */

    if (
      currentBeat ===
      0
    ) {

      currentBeat =
        1;


      if (
        totalBars ===
        0
      ) {

        totalBars =
          1;

      }

    } else {

      currentBeat++;


      /*
        Example:

        BAR 1
        Beat 1
        Beat 2
        Beat 3
        Beat 4

        Next Beat 1:
        BAR 2
      */

      if (
        currentBeat >
        beatsPerBar
      ) {

        currentBeat =
          1;


        totalBars++;

      }
    }


    /*
      Main beat only.

      Click subdivisions do not
      increase Total Beats.
    */

    totalBeats++;


    const mode =

      beatModes[
        currentBeat -
        1
      ] ||

      "normal";


    playClick(
      mode
    );


    flashBeat(
      currentBeat
    );


    startBeatMotionLeg();


    updateDisplays();
  }


  /* ==================================================
     START / STOP
     ================================================== */

  function toggleMetronome() {

    getAudioContext();


    if (
      isRunning
    ) {

      stopMetronome();

    } else {

      startMetronome();

    }
  }


  function startMetronome() {

    if (
      isRunning
    ) {

      return;

    }


    isRunning =
      true;


    const button =
      document.getElementById(
        "startButton"
      );


    button.textContent =
      "■";


    button.title =
      "Stop Metronome";


    button.classList.add(
      "stop-button"
    );


    /*
      First beat occurs immediately.
    */

    tick();


    scheduleTimer();
  }


  function stopMetronome() {

    isRunning =
      false;


    clearInterval(
      timer
    );


    timer =
      null;


    resetBeatAnimation();


    const button =
      document.getElementById(
        "startButton"
      );


    button.textContent =
      "▶";


    button.title =
      "Start Metronome";


    button.classList.remove(
      "stop-button"
    );


    /*
      Automatically reset
      counters on STOP.
    */

    totalBars =
      0;


    totalBeats =
      0;


    currentBeat =
      0;


    document
      .querySelectorAll(
        ".beat-light"
      )
      .forEach(

        function(
          light
        ) {

          light.classList.remove(
            "playing"
          );

        }

      );


    updateDisplays();
  }


  /* ==================================================
     TIMER
     ================================================== */

  function scheduleTimer() {

    clearInterval(
      timer
    );


    const interval =
      60000 /
      bpm;


    timer =
      setInterval(
        tick,
        interval
      );
  }


  /* ==================================================
     BPM
     ================================================== */

  function setBPM(
    value
  ) {

    let newBPM =
      Number(
        value
      );


    if (
      Number.isNaN(
        newBPM
      )
    ) {

      newBPM =
        100;

    }


    newBPM =
      Math.max(
        5,
        Math.min(
          newBPM,
          500
        )
      );


    bpm =
      Math.round(
        newBPM
      );


    document.getElementById(
      "bpmInput"
    ).value =
      bpm;


    document.getElementById(
      "bpmSlider"
    ).value =
      bpm;


    updateTempoMarking();


    if (
      isRunning
    ) {

      scheduleTimer();


      startBeatMotionLeg();

    }
  }


  function changeBPM(
    amount
  ) {

    setBPM(
      bpm +
      amount
    );
  }


  /* ==================================================
     TEMPO MARKING
     ================================================== */

  function updateTempoMarking() {

    let marking;


    if (
      bpm <
      24
    ) {

      marking =
        "Larghissimo";

    } else if (
      bpm <
      40
    ) {

      marking =
        "Grave";

    } else if (
      bpm <
      60
    ) {

      marking =
        "Largo";

    } else if (
      bpm <
      66
    ) {

      marking =
        "Larghetto";

    } else if (
      bpm <
      76
    ) {

      marking =
        "Adagio";

    } else if (
      bpm <
      108
    ) {

      marking =
        "Andante";

    } else if (
      bpm <
      120
    ) {

      marking =
        "Moderato";

    } else if (
      bpm <
      168
    ) {

      marking =
        "Allegro";

    } else if (
      bpm <
      200
    ) {

      marking =
        "Presto";

    } else {

      marking =
        "Prestissimo";

    }


    document.getElementById(
      "tempoMarking"
    ).textContent =
      marking;
  }


  /* ==================================================
     TAP TEMPO
     ================================================== */

  function tapTempo() {

    const now =
      performance.now();


    if (
      tapTimes.length >
        0 &&
      now -
        tapTimes[
          tapTimes.length -
          1
        ] >
        2000
    ) {

      tapTimes =
        [];

    }


    tapTimes.push(
      now
    );


    if (
      tapTimes.length >
      8
    ) {

      tapTimes.shift();

    }


    if (
      tapTimes.length <
      2
    ) {

      return;

    }


    let totalInterval =
      0;


    for (
      let i = 1;
      i <
      tapTimes.length;
      i++
    ) {

      totalInterval +=

        tapTimes[i] -
        tapTimes[
          i -
          1
        ];

    }


    const averageInterval =

      totalInterval /
      (
        tapTimes.length -
        1
      );


    const tappedBPM =

      Math.round(
        60000 /
        averageInterval
      );


    setBPM(
      tappedBPM
    );
  }


  /* ==================================================
     BEATS PER BAR
     ================================================== */

  function changeBeatsPerBar() {

    currentBeat =
      0;


    if (
      isRunning
    ) {

      /*
        Changing Beats per Bar
        while running begins
        a fresh bar.
      */

      if (
        totalBars >
        0
      ) {

        totalBars++;

      }

    } else {

      totalBars =
        0;


      totalBeats =
        0;

    }


    createBeatLights();


    resetBeatAnimation();


    updateDisplays();
  }


  /* ==================================================
     CLICKS PER BEAT
     ================================================== */

  function changeClicksPerBeat() {

    let newValue =
      Number(
        document.getElementById(
          "clicksPerBeat"
        ).value
      );


    if (
      Number.isNaN(
        newValue
      )
    ) {

      newValue =
        1;

    }


    clicksPerBeat =
      Math.max(
        1,
        Math.min(
          newValue,
          8
        )
      );


    document.getElementById(
      "clicksPerBeat"
    ).value =
      clicksPerBeat;
  }


  /* ==================================================
     COUNTER DISPLAY
     ================================================== */

  function updateDisplays() {

    document.getElementById(
      "barCounter"
    ).textContent =
      totalBars;


    document.getElementById(
      "beatCounter"
    ).textContent =
      totalBeats;
  }


  /* ==================================================
     COUNTER VISIBILITY

     IMPORTANT:
     Beat Lights are NEVER hidden.
     ================================================== */

  function updateBarBeatDisplayVisibility() {

    const barCounterBox =
      document.getElementById(
        "barCounterBox"
      );


    const beatCounterBox =
      document.getElementById(
        "beatCounterBox"
      );


    /*
      visibility:hidden keeps the
      center beat lights perfectly
      centered because left and right
      spaces remain reserved.
    */

    if (
      barCounterBox
    ) {

      barCounterBox.style.visibility =

        BAR_BEAT_DISPLAY_VISIBLE
          ? "visible"
          : "hidden";

    }


    if (
      beatCounterBox
    ) {

      beatCounterBox.style.visibility =

        BAR_BEAT_DISPLAY_VISIBLE
          ? "visible"
          : "hidden";

    }
  }


  /* ==================================================
     BEAT ANIMATION VISIBILITY
     ================================================== */

  function updateBeatAnimationVisibility() {

    const area =
      document.getElementById(
        "beatMotionArea"
      );


    if (
      !area
    ) {

      return;

    }


    area.style.display =

      BEAT_ANIMATION_ENABLED
        ? "block"
        : "none";
  }


  /* ==================================================
     KEYBOARD SHORTCUTS
     ================================================== */

  document.addEventListener(
    "keydown",
    function(
      event
    ) {

      const tag =
        event.target.tagName;


      if (
        tag ===
          "INPUT" ||
        tag ===
          "SELECT"
      ) {

        return;

      }


      /*
        SPACE:
        START / STOP
      */

      if (
        event.code ===
        "Space"
      ) {

        event.preventDefault();


        toggleMetronome();

      }


      /*
        T:
        TAP TEMPO
      */

      if (
        event.key.toLowerCase() ===
        "t"
      ) {

        tapTempo();

      }


      /*
        UP:
        +1 BPM
      */

      if (
        event.key ===
        "ArrowUp"
      ) {

        changeBPM(
          1
        );

      }


      /*
        DOWN:
        -1 BPM
      */

      if (
        event.key ===
        "ArrowDown"
      ) {

        changeBPM(
          -1
        );

      }
    }
  );


  /* ==================================================
     WINDOW RESIZE
     ================================================== */

  window.addEventListener(
    "resize",
    function() {

      resetBeatAnimation();


      if (
        isRunning
      ) {

        startBeatMotionLeg();

      }

    }
  );


  /* ==================================================
     PAGE LOAD
     ================================================== */

  window.addEventListener(
    "load",
    function() {

      setBPM(
        100
      );


      updateVolume(
        70
      );


      changeClicksPerBeat();


      createBeatLights();


      resetBeatAnimation();


      updateDisplays();


      updateBarBeatDisplayVisibility();


      updateBeatAnimationVisibility();

    }
  );

</script>

</body>
</html>

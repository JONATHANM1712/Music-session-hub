<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chord Player | Music Session Hub</title><link rel="stylesheet" href="style.css"><style>main{max-width:800px;margin:8vh auto;padding:25px;color:white} .panel{background:#222b;border:1px solid #ffffff33;border-radius:22px;padding:28px}select,button{padding:13px 18px;border-radius:12px;font:inherit;margin:8px;background:#e8fff5;color:#16221c;border:0}button{cursor:pointer}h1{font-size:clamp(2rem,5vw,3.5rem)}.notes{font-size:1.5rem;margin:20px 0}</style><link rel="stylesheet" href="rubik-font.css">
</head><body><main><a href="index.html#tools" style="color:#a8ffe1">← Back to Tools</a><h1>🎹 Chord Player</h1><div class="panel"><label>Root note <select id="root"></select></label><label>Chord type <select id="quality"><option value="major">Major</option><option value="minor">Minor</option><option value="dim">Diminished</option><option value="aug">Augmented</option><option value="7">Dominant 7th</option><option value="maj7">Major 7th</option><option value="m7">Minor 7th</option></select></label><div class="notes" id="notes"></div><button id="play">▶ Play Chord</button><button id="stop">■ Stop</button></div></main><script>const names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];const root=document.getElementById('root'),quality=document.getElementById('quality'),notes=document.getElementById('notes');names.forEach((n,i)=>root.add(new Option(n,i)));const shapes={major:[0,4,7],minor:[0,3,7],dim:[0,3,6],aug:[0,4,8],7:[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10]};let ctx,voices=[];function midi(){return shapes[quality.value].map(i=>60+Number(root.value)+i)}function refresh(){notes.textContent=midi().map(n=>names[n%12]+(Math.floor(n/12)-1)).join(' · ')}root.onchange=quality.onchange=refresh;refresh();document.getElementById('play').onclick=()=>{stop();ctx??=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();voices=midi().map(n=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.11/midi().length,ctx.currentTime+.04);o.connect(g).connect(ctx.destination);o.start();return {o,g}})};function stop(){if(!ctx)return;voices.forEach(({o,g})=>{g.gain.setTargetAtTime(.0001,ctx.currentTime,.05);o.stop(ctx.currentTime+.3)});voices=[]}document.getElementById('stop').onclick=stop;window.addEventListener('pagehide',stop)</script></body></html>
